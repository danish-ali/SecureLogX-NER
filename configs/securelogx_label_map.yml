---
# SecureLogX ML-v1 source-label normalization.
#
# `null` means that the source span is not an ML-v1 training entity. The
# converter still records the span and its disposition in metadata. Sensitive
# deferred/healthcare spans set training_exclusion=true; deliberately benign
# labels (for example a generic date) do not.

ontology:
  name: SecureLogX
  version: ML-v1
  entity_count: 25
  bio_label_count: 51

# Product-taxonomy aliases that collapse into the frozen neural ontology.
# The original subtype is retained per span by every converter.
normalization_aliases:
  FIRST_NAME: PERSON_NAME
  MIDDLE_NAME: PERSON_NAME
  LAST_NAME: PERSON_NAME
  CARDHOLDER_NAME: PERSON_NAME
  ADDRESS_LINE_1: STREET_ADDRESS
  ADDRESS_LINE_2: STREET_ADDRESS
  ZIP_CODE: POSTAL_CODE
  CUSTOMER_ID: BUSINESS_ID
  ACCOUNT_ID: BUSINESS_ID
  LOAN_NUMBER: BUSINESS_ID
  APPLICATION_ID: BUSINESS_ID
  TRANSACTION_ID: BUSINESS_ID
  USER_ID: BUSINESS_ID

# These remain in the broader SecureLogX taxonomy, but are not independent
# ML-v1 neural labels.
deferred_labels:
  - PASSWORD
  - PIN
  - OTP
  - SECURITY_ANSWER
  - JWT
  - SESSION_ID
  - COOKIE
  - CVV
  - CARD_EXPIRY
  - MAC_ADDRESS
  - GEOLOCATION
  - BIOMETRIC_ID

# Reserved for a later healthcare extension; never fold these into ML-v1.
healthcare_extension_labels:
  - PROVIDER_NPI
  - MRN
  - PATIENT_ID
  - HEALTH_PLAN_ID
  - CLAIM_ID
  - PRESCRIPTION_ID
  - DIAGNOSIS_CODE
  - PROCEDURE_CODE
  - LAB_ORDER_ID

# Deliberately non-sensitive source annotations. They are retained as excluded
# span provenance with training_exclusion=false.
benign_unmapped_labels:
  - DATE
  - TIME
  - DATE_TIME
  - COMPANY
  - ORGANIZATION
  - ORGANIZATION_NAME
  - JOB

# Normalize source spellings to a stable source subtype. This is separate from
# the neural mapping so BUSINESS_ID provenance remains recoverable.
